<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="container">

<div class="card p-4">

<h2 class="text-center mb-4">

<i class="fa-solid fa-user-shield text-primary"></i>

Dashboard

</h2>

<h4 class="text-center">

Welcome,

<span id="userName"></span> 👋

</h4>

<p class="text-center text-muted">

<span id="userEmail"></span>

</p>

<hr>

<div class="row g-3">

<div class="col-md-4">

<div class="card text-center p-3">

<i class="fa-solid fa-user fa-2x text-primary mb-3"></i>

<h5>My Profile</h5>

<p class="text-muted">

View and update your profile.

</p>

<a href="/profile-page" class="btn btn-primary">

Open

</a>

</div>

</div>

<div class="col-md-4">

<div class="card text-center p-3">

<i class="fa-solid fa-key fa-2x text-warning mb-3"></i>

<h5>Reset Password</h5>

<p class="text-muted">

Forgot your password?

</p>

<a href="/forgot-page" class="btn btn-warning">

Reset

</a>

</div>

</div>

<div class="col-md-4">

<div class="card text-center p-3">

<i class="fa-solid fa-right-from-bracket fa-2x text-danger mb-3"></i>

<h5>Logout</h5>

<p class="text-muted">

Sign out securely.

</p>

<button
class="btn btn-danger"
onclick="logout()">

Logout

</button>

</div>

</div>

</div>

<hr>

<h4 class="mt-4 mb-3 text-center">

Project Features

</h4>

<div class="row text-center">

<div class="col-md-3 mb-3">

✅ Register

</div>

<div class="col-md-3 mb-3">

✅ Login

</div>

<div class="col-md-3 mb-3">

✅ JWT Authentication

</div>

<div class="col-md-3 mb-3">

✅ OTP Reset

</div>

<div class="col-md-3 mb-3">

✅ Email Verification

</div>

<div class="col-md-3 mb-3">

✅ Password Hashing

</div>

<div class="col-md-3 mb-3">

✅ User Profile

</div>

<div class="col-md-3 mb-3">

✅ Bootstrap UI

</div>

</div>

</div>

</div>

<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>

</body>

</html>
